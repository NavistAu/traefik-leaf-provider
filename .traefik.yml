displayName: Leaf Provider
type: provider
import: github.com/jhogendorn/traefik-leaf-provider
summary: >-
  Aggregates Host rules from downstream "leaf" traefik instances and
  forwards matched traffic to each leaf's web entrypoint (two-hop).
  No network I/O at init; per-endpoint error isolation with
  last-known-good fallback.

testData:
  pollInterval: 5s
  requestTimeout: 3s
  endpoints:
    - name: example
      apiUrl: http://127.0.0.1:8080
      webUrl: http://127.0.0.1:80
