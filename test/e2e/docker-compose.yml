# E2E: main traefik loads this repo as a LOCAL plugin (under Yaegi —
# the only runtime whose verdict counts), aggregates from one live leaf
# and one dead endpoint, and must still start and route. main's plugin
# config (incl. routeMiddlewares) is a mounted static file — see
# traefik.yml — because CLI flags can't cleanly express a map of lists.
services:
  main:
    image: traefik:v3.7
    command:
      - --configFile=/etc/traefik/traefik.yml
    ports:
      - "127.0.0.1:18080:80"
      - "127.0.0.1:18081:8080"
    volumes:
      - ../..:/plugins-local/src/github.com/jhogendorn/traefik-leaf-provider:ro
      - ./traefik.yml:/etc/traefik/traefik.yml:ro
      - ./dynamic:/etc/traefik/dynamic:ro

  leaf:
    image: traefik:v3.7
    command:
      - --api.insecure=true
      - --entrypoints.web.address=:80
      - --providers.docker=true
      - --providers.docker.exposedByDefault=false
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro

  whoami:
    image: traefik/whoami
    labels:
      traefik.enable: "true"
      traefik.http.routers.whoami.rule: Host(`whoami.test`)
      traefik.http.routers.whoami.entrypoints: web
      traefik.http.services.whoami.loadbalancer.server.port: "80"

  # Second leaf router with no routeMiddlewares entry: proves override
  # is per-route, not endpoint-wide (endpoint has no `middlewares`
  # default here, so this route must come through with none attached).
  whoami2:
    image: traefik/whoami
    labels:
      traefik.enable: "true"
      traefik.http.routers.whoami2.rule: Host(`whoami2.test`)
      traefik.http.routers.whoami2.entrypoints: web
      traefik.http.services.whoami2.loadbalancer.server.port: "80"
