# E2E: main traefik loads this repo as a LOCAL plugin (under Yaegi —
# the only runtime whose verdict counts), aggregates from one live leaf
# and one dead endpoint, and must still start and route.
services:
  main:
    image: traefik:v3.7
    command:
      - --api.insecure=true
      - --entrypoints.web.address=:80
      - --experimental.localPlugins.leafprovider.moduleName=github.com/jhogendorn/traefik-leaf-provider
      - --providers.plugin.leafprovider.pollInterval=2s
      - --providers.plugin.leafprovider.requestTimeout=2s
      - --providers.plugin.leafprovider.endpoints[0].name=leaf1
      - --providers.plugin.leafprovider.endpoints[0].apiUrl=http://leaf:8080
      - --providers.plugin.leafprovider.endpoints[0].webUrl=http://leaf:80
      # Dead endpoint (TEST-NET-1): proves no-crash startup + isolation.
      - --providers.plugin.leafprovider.endpoints[1].name=deadleaf
      - --providers.plugin.leafprovider.endpoints[1].apiUrl=http://192.0.2.1:9
      - --providers.plugin.leafprovider.endpoints[1].webUrl=http://192.0.2.1:80
    ports:
      - "127.0.0.1:18080:80"
      - "127.0.0.1:18081:8080"
    volumes:
      - ../..:/plugins-local/src/github.com/jhogendorn/traefik-leaf-provider:ro

  leaf:
    image: traefik:v3.7
    command:
      - --api.insecure=true
      - --entrypoints.web.address=:80
      - --providers.docker=true
      - --providers.docker.exposedByDefault=false
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro

  whoami:
    image: traefik/whoami
    labels:
      traefik.enable: "true"
      traefik.http.routers.whoami.rule: Host(`whoami.test`)
      traefik.http.routers.whoami.entrypoints: web
      traefik.http.services.whoami.loadbalancer.server.port: "80"
