# E2E: main traefik loads this repo as a LOCAL plugin (under Yaegi —
# the only runtime whose verdict counts), aggregates from one live leaf
# and one dead endpoint, and must still start and route. main's plugin
# config (incl. routeMiddlewares) is a mounted static file — see
# traefik.yml — because CLI flags can't cleanly express a map of lists.
services:
  main:
    image: traefik:v3.7
    command:
      - --configFile=/etc/traefik/traefik.yml
    ports:
      - "127.0.0.1:18080:80"
      - "127.0.0.1:18081:8080"
    volumes:
      - ../..:/plugins-local/src/github.com/NavistAu/traefik-leaf-provider:ro
      - ./traefik.yml:/etc/traefik/traefik.yml:ro
      - ./dynamic:/etc/traefik/dynamic:ro
      # Generated by run.sh; gitignored. The main instance needs the CA to
      # verify the mTLS gate and its own keypair to authenticate to it.
      - ./certs:/certs:ro

  # An mTLS gate in front of the leaf's API. The mtlsleaf endpoint can
  # only aggregate through this if the plugin's hop-1 TLS path works
  # under Yaegi — see mtls/nginx.conf.
  leafmtls:
    image: nginx:alpine
    depends_on: [leaf2]
    volumes:
      - ./mtls/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./certs:/certs:ro

  # Two leaves, partitioned by a docker label constraint. They share a
  # docker socket, so without the constraint both would see every whoami
  # and the mTLS endpoint would emit routers whose Host rules collide
  # with leaf1's. Traefik then picks a winner arbitrarily and the
  # routeMiddlewares assertions become a coin toss (CI caught exactly
  # that on 2026-07-30; three local runs had not).
  leaf:
    image: traefik:v3.7
    command:
      - --api.insecure=true
      - --entrypoints.web.address=:80
      - --providers.docker=true
      - --providers.docker.exposedByDefault=false
      - --providers.docker.constraints=Label(`leafgroup`,`a`)
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro

  # The leaf behind the mTLS gate. Serves a host nothing else serves.
  leaf2:
    image: traefik:v3.7
    command:
      - --api.insecure=true
      - --entrypoints.web.address=:80
      - --providers.docker=true
      - --providers.docker.exposedByDefault=false
      - --providers.docker.constraints=Label(`leafgroup`,`b`)
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro

  whoami:
    image: traefik/whoami
    labels:
      leafgroup: "a"
      traefik.enable: "true"
      traefik.http.routers.whoami.rule: Host(`whoami.test`)
      traefik.http.routers.whoami.entrypoints: web
      traefik.http.services.whoami.loadbalancer.server.port: "80"

  # Second leaf router with no routeMiddlewares entry: proves override
  # is per-route, not endpoint-wide (endpoint has no `middlewares`
  # default here, so this route must come through with none attached).
  whoami2:
    image: traefik/whoami
    labels:
      leafgroup: "a"
      traefik.enable: "true"
      traefik.http.routers.whoami2.rule: Host(`whoami2.test`)
      traefik.http.routers.whoami2.entrypoints: web
      traefik.http.services.whoami2.loadbalancer.server.port: "80"

  # Only leaf2 sees this one, so the mTLS endpoint aggregates a host that
  # no other endpoint serves. No rule collision, no coin toss.
  whoami3:
    image: traefik/whoami
    labels:
      leafgroup: "b"
      traefik.enable: "true"
      traefik.http.routers.whoami3.rule: Host(`whoami3.test`)
      traefik.http.routers.whoami3.entrypoints: web
      traefik.http.services.whoami3.loadbalancer.server.port: "80"
