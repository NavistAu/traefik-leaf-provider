# An mTLS gate in front of the leaf's traefik API, standing in for a
# zero-trust estate where /api/rawdata is not reachable without a client
# certificate. This is what exercises the plugin's hop-1 TLS path under
# Yaegi: if buildTLSConfig does not work interpreted, nothing gets past
# ssl_verify_client and the mtlsleaf endpoint aggregates nothing.
events {}

http {
  access_log /dev/stdout;
  error_log  /dev/stderr info;

  server {
    listen 8443 ssl;

    ssl_certificate        /certs/server.crt;
    ssl_certificate_key    /certs/server.key;
    ssl_client_certificate /certs/ca.pem;
    ssl_verify_client      on;
    ssl_protocols          TLSv1.2 TLSv1.3;

    location / {
      proxy_pass http://leaf2:8080;
      proxy_set_header Host $host;
    }
  }
}
