# Static config for the "main" e2e traefik. CLI flags can't cleanly
# express the map-of-list `routeMiddlewares` shape, so main's plugin
# config lives here instead (see run.sh / README routeMiddlewares docs).
api:
  insecure: true

entryPoints:
  web:
    address: ":80"

experimental:
  localPlugins:
    leafprovider:
      moduleName: github.com/NavistAu/traefik-leaf-provider

providers:
  file:
    filename: /etc/traefik/dynamic/mw.yml
  plugin:
    leafprovider:
      pollInterval: 2s
      requestTimeout: 2s
      endpoints:
        - name: leaf1
          apiUrl: http://leaf:8080
          webUrl: http://leaf:80
          routeMiddlewares:
            whoami:
              - testmw@file
            ghost:
              - testmw@file
        # Dead endpoint (TEST-NET-1): proves no-crash startup + isolation.
        - name: deadleaf
          apiUrl: http://192.0.2.1:9
          webUrl: http://192.0.2.1:80
        # Polls the leaf API through an mTLS gate. Aggregating anything
        # here proves the hop-1 TLS path (private CA + client keypair)
        # executes under Yaegi, not just under the compiler.
        - name: mtlsleaf
          apiUrl: https://leafmtls:8443
          webUrl: http://leaf:80
          tls:
            rootCAs:
              - /certs/ca.pem
            certificates:
              - certFile: /certs/client.crt
                keyFile: /certs/client.key
        # Same gate, CA but NO client keypair. Negative control: the gate
        # must reject it, proving mTLS is genuinely enforced and that the
        # endpoint above is not passing for some unrelated reason.
        - name: mtlsnocert
          apiUrl: https://leafmtls:8443
          webUrl: http://leaf:80
          tls:
            rootCAs:
              - /certs/ca.pem
